<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영남대 맛집 옥이네 - 메뉴 추천 & 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f9fafb; }
        .sticky-footer { position: sticky; bottom: 0; z-index: 50; }
        .menu-card { transition: all 0.2s ease; }
        .menu-card:active { transform: scale(0.98); }
        .category-tab.active { border-bottom: 3px solid #f59e0b; color: #f59e0b; font-weight: bold; }
    </style>
</head>
<body class="pb-32">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-amber-600">옥이네</h1>
                <p class="text-xs text-gray-500 font-medium">영남대 앞 연탄불고기 찐맛집</p>
            </div>
            <a href="https://naver.me/GGGNFbOw" target="_blank" class="bg-green-500 text-white px-3 py-2 rounded-full text-xs font-bold shadow-md flex items-center gap-1 hover:bg-green-600">
                <i class="fa-solid fa-location-dot"></i> 네이버 지도
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6">
        
        <!-- Recommendations Section -->
        <section class="mb-8">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-500"></i> 오늘의 꿀조합 추천
            </h2>
            <div class="flex gap-4 overflow-x-auto pb-4 no-scrollbar">
                <!-- Pair 1 -->
                <div onclick="addRecommendation('classic')" class="flex-shrink-0 w-64 bg-amber-50 border border-amber-200 p-4 rounded-2xl cursor-pointer hover:shadow-md transition-shadow">
                    <span class="bg-amber-500 text-white text-[10px] px-2 py-1 rounded-full font-bold">인기 만점</span>
                    <h3 class="font-bold mt-2 text-amber-900">옥이네 클래식 세트</h3>
                    <p class="text-xs text-amber-700 mt-1">연탄불고기 + 비빔국수 + 소주</p>
                    <div class="mt-3 text-right">
                        <span class="text-sm font-bold text-amber-600">추천 조합 담기 ></span>
                    </div>
                </div>
                <!-- Pair 2 -->
                <div onclick="addRecommendation('hearty')" class="flex-shrink-0 w-64 bg-blue-50 border border-blue-200 p-4 rounded-2xl cursor-pointer hover:shadow-md transition-shadow">
                    <span class="bg-blue-500 text-white text-[10px] px-2 py-1 rounded-full font-bold">든든 한끼</span>
                    <h3 class="font-bold mt-2 text-blue-900">소주 도둑 찌개 조합</h3>
                    <p class="text-xs text-blue-700 mt-1">삼겹 김치찌개 + 대왕 계란말이</p>
                    <div class="mt-3 text-right">
                        <span class="text-sm font-bold text-blue-600">추천 조합 담기 ></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Menu Navigation -->
        <div class="flex border-b mb-4 overflow-x-auto no-scrollbar whitespace-nowrap bg-white sticky top-16 z-30">
            <button onclick="scrollToSection('anju')" class="category-tab px-4 py-3 text-sm active">안주류</button>
            <button onclick="scrollToSection('shiksa')" class="category-tab px-4 py-3 text-sm">식사류</button>
            <button onclick="scrollToSection('side')" class="category-tab px-4 py-3 text-sm">사이드</button>
            <button onclick="scrollToSection('drink')" class="category-tab px-4 py-3 text-sm">주류</button>
        </div>

        <!-- Menu Lists -->
        <div id="menu-container" class="space-y-10">
            
            <!-- 안주류 -->
            <section id="anju">
                <h3 class="font-bold text-gray-800 mb-4 border-l-4 border-amber-500 pl-2">안주류</h3>
                <div class="grid grid-cols-1 gap-3" id="list-anju"></div>
            </section>

            <!-- 식사류 -->
            <section id="shiksa">
                <h3 class="font-bold text-gray-800 mb-4 border-l-4 border-amber-500 pl-2">식사 세트</h3>
                <div class="grid grid-cols-1 gap-3" id="list-shiksa"></div>
            </section>

            <!-- 사이드 -->
            <section id="side">
                <h3 class="font-bold text-gray-800 mb-4 border-l-4 border-amber-500 pl-2">사이드 메뉴</h3>
                <div class="grid grid-cols-1 gap-3" id="list-side"></div>
            </section>

            <!-- 주류 -->
            <section id="drink">
                <h3 class="font-bold text-gray-800 mb-4 border-l-4 border-amber-500 pl-2">주류</h3>
                <div class="grid grid-cols-1 gap-3" id="list-drink"></div>
            </section>

        </div>
    </main>

    <!-- Footer Total Section -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] p-4 z-50">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-3">
                <span class="text-gray-600 text-sm">선택한 메뉴 <span id="selected-count" class="font-bold text-amber-600">0</span>개</span>
                <button onclick="resetCart()" class="text-xs text-gray-400 underline italic">전체 초기화</button>
            </div>
            <div class="flex justify-between items-center bg-amber-600 text-white p-4 rounded-xl shadow-lg">
                <div class="flex flex-col">
                    <span class="text-[10px] opacity-80 uppercase tracking-wider">Total Amount</span>
                    <span class="text-xl font-bold"><span id="total-price">0</span>원</span>
                </div>
                <button class="bg-white text-amber-600 px-6 py-2 rounded-lg font-bold shadow-inner">
                    주문 내역 보기
                </button>
            </div>
        </div>
    </div>

    <!-- Alert Modal (Custom) -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[100] p-6">
        <div class="bg-white rounded-2xl p-6 w-full max-w-xs text-center">
            <h4 id="modal-title" class="font-bold text-lg mb-2">알림</h4>
            <p id="modal-content" class="text-gray-600 text-sm mb-6"></p>
            <button onclick="closeModal()" class="w-full bg-amber-600 text-white py-3 rounded-xl font-bold">확인</button>
        </div>
    </div>

    <script>
        const menuData = {
            anju: [
                { id: 'a1', name: '연탄 불고기 (간장)', price: 19500 },
                { id: 'a2', name: '연탄 불고기 (고추장)', price: 19500 },
                { id: 'a3', name: '대왕 계란 말이', price: 10000 },
                { id: 'a4', name: '두부 김치', price: 15000 },
                { id: 'a5', name: '삼겹 김치 찌개', price: 18000 },
                { id: 'a6', name: '냄비 닭갈비', price: 22000 },
                { id: 'a7', name: '오삼불고기 (안주)', price: 22000 },
                { id: 'a8', name: '국물 닭발', price: 20000 },
                { id: 'a9', name: '감자 튀김', price: 8000 },
                { id: 'a10', name: '모듬 튀김', price: 12000 }
            ],
            shiksa: [
                { id: 's1', name: '불고기 세트 2인 (된찌+밥)', price: 25000 },
                { id: 's2', name: '불고기 세트 3인 (된찌+밥)', price: 35000 },
                { id: 's3', name: '닭갈비 세트 2인 (된찌+밥)', price: 25000 },
                { id: 's4', name: '나홀로 1인 세트', price: 13000 }
            ],
            side: [
                { id: 'si1', name: '비빔국수', price: 7000 },
                { id: 'si2', name: '얼큰라면', price: 5000 },
                { id: 'si3', name: '우동', price: 5000 },
                { id: 'si4', name: '유부초밥', price: 5000 },
                { id: 'si5', name: '주먹밥', price: 5000 }
            ],
            drink: [
                { id: 'd1', name: '맛참/이슬/진로/새로', price: 4500 },
                { id: 'd2', name: '카스/테라', price: 4500 },
                { id: 'd3', name: '별빛 청하/심술', price: 6000 },
                { id: 'd4', name: '느린마을 막걸리', price: 6000 },
                { id: 'd5', name: '바밤바밤/프리바이오', price: 6000 },
                { id: 'd6', name: '국순당', price: 4500 }
            ]
        };

        let cart = {};

        function initMenu() {
            Object.keys(menuData).forEach(cat => {
                const list = document.getElementById(`list-${cat}`);
                menuData[cat].forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'menu-card bg-white p-4 rounded-xl border border-gray-100 flex justify-between items-center shadow-sm';
                    card.innerHTML = `
                        <div>
                            <p class="font-bold text-gray-800 text-sm">${item.name}</p>
                            <p class="text-amber-600 font-bold text-sm mt-1">${item.price.toLocaleString()}원</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="updateQty('${item.id}', -1)" class="w-8 h-8 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 active:bg-gray-100"><i class="fa-solid fa-minus"></i></button>
                            <span id="qty-${item.id}" class="w-4 text-center font-bold text-gray-700">0</span>
                            <button onclick="updateQty('${item.id}', 1)" class="w-8 h-8 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center active:bg-amber-200"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    `;
                    list.appendChild(card);
                });
            });
        }

        function updateQty(id, delta) {
            const current = cart[id] || 0;
            const next = Math.max(0, current + delta);
            
            if (next === 0) {
                delete cart[id];
            } else {
                cart[id] = next;
            }
            
            document.getElementById(`qty-${id}`).innerText = next;
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            let count = 0;
            
            Object.keys(cart).forEach(id => {
                const allMenus = Object.values(menuData).flat();
                const item = allMenus.find(m => m.id === id);
                if (item) {
                    total += item.price * cart[id];
                    count += cart[id];
                }
            });
            
            document.getElementById('total-price').innerText = total.toLocaleString();
            document.getElementById('selected-count').innerText = count;
        }

        function addRecommendation(type) {
            resetCart();
            if (type === 'classic') {
                updateQty('a1', 1); // 간장불고기
                updateQty('si1', 1); // 비빔국수
                updateQty('d1', 1); // 소주
                showModal("클래식 세트 추가 완료!", "옥이네의 시그니처, 연탄불고기와 비빔국수의 환상 조합을 선택하셨습니다.");
            } else if (type === 'hearty') {
                updateQty('a5', 1); // 김치찌개
                updateQty('a3', 1); // 계란말이
                showModal("든든 조합 추가 완료!", "술이 술술 들어가는 얼큰한 김치찌개와 대왕 계란말이 조합입니다.");
            }
        }

        function resetCart() {
            cart = {};
            const allQtys = document.querySelectorAll('[id^="qty-"]');
            allQtys.forEach(el => el.innerText = '0');
            calculateTotal();
        }

        function scrollToSection(id) {
            const el = document.getElementById(id);
            const offset = 140; 
            const bodyRect = document.body.getBoundingClientRect().top;
            const elementRect = el.getBoundingClientRect().top;
            const elementPosition = elementRect - bodyRect;
            const offsetPosition = elementPosition - offset;

            window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
            });

            // Update Active Tab
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.innerText.includes(el.querySelector('h3').innerText.substring(0,2))) {
                    tab.classList.add('active');
                }
            });
        }

        function showModal(title, content) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerText = content;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        window.onload = initMenu;
    </script>
</body>
</html>
